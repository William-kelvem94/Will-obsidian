<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will-obsidian — Busca RAG</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>🧠 Will-obsidian</h1>
  <p class="subtitle">Busca semântica no vault de conhecimento</p>
  <div class="search-bar">
    <input type="text" id="query" placeholder="Pesquise no vault… (ex: RAG, embeddings, segurança)">
    <button id="search-btn">🔍 Buscar</button>
    <button id="reload-btn" title="Recarregar índice">🔄</button>
  </div>
  <div class="stats" id="stats"></div>
</header>
<main>
  <div id="results" class="results"></div>
  <div id="loading" class="hidden">Carregando índice…</div>
</main>
<footer>
  <small>Will-obsidian v1.1 — <span id="chunk-count">0</span> chunks indexados</small>
</footer>
<script src="app.js"></script>
</body>
</html>
