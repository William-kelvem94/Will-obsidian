repos:
  - repo: https://github.com/psf/black
    rev: 23.9.1
    hooks:
      - id: black
        language_version: python3

  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.23.2
    hooks:
      - id: ruff

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml

  - repo: local
    hooks:
      - id: audit-sensitives
        name: Auditoria de arquivos sensíveis
        entry: python scripts/audit_sensitives.py
        language: system
        files: \.md$
        stages: [pre-commit, pre-push]
        verbose: true

      - id: enrich-frontmatter
        name: Verificação de frontmatter
        entry: python scripts/enrich_frontmatter.py
        language: system
        files: \.md$
        stages: [pre-commit]
        pass_filenames: false
        verbose: true
